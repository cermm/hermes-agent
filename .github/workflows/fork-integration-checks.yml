name: Fork integration checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  affected-python:
    if: github.repository == 'cermm/hermes-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: '0.9.28'
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install locked affected-suite dependencies
        run: uv sync --locked --python 3.11 --extra all --extra dev --extra anthropic --extra messaging
      - name: Install Node for Photon Python integration fixtures
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
      - name: Install ripgrep
        run: |
          set -euo pipefail
          RG_VERSION=15.1.0
          RG_SHA256=1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
          RG_TARBALL=ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz
          curl -sSfL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/$RG_TARBALL" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_TARBALL}"
          echo "${RG_SHA256}  $RUNNER_TEMP/$RG_TARBALL" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$RG_TARBALL" -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg
          rg --version
      - name: Validate exact manifest and run canonical affected suite
        run: .venv/bin/python scripts/run_fork_integration.py
