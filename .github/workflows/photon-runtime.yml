name: Photon runtime compatibility

on:
  pull_request:
    paths:
      - plugins/platforms/photon/sidecar/**
      - .github/workflows/photon-runtime.yml
  push:
    branches: [main]
    paths:
      - plugins/platforms/photon/sidecar/**
      - .github/workflows/photon-runtime.yml

permissions:
  contents: read

jobs:
  telemetry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: plugins/platforms/photon/sidecar
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugins/platforms/photon/sidecar/package-lock.json
      - run: npm install --global npm@11.17.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node patch-spectrum-mixed-attachments.mjs
      - run: npm test
